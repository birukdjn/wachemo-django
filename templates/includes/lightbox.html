<!-- Universal Full-Screen Gallery Lightbox -->
<div id="galleryLightboxModal" class="fixed inset-0 z-[100] bg-navy-950/95 backdrop-blur-xl hidden flex-col justify-between transition-all duration-300 select-none">
    
    <!-- Top Toolbar -->
    <div class="flex items-center justify-between p-4 md:px-8 border-b border-white/10 bg-navy-900/60 z-10">
        <!-- Counter -->
        <div class="flex items-center gap-3">
            <span id="lightboxCounter" class="text-xs font-bold text-amber-400 bg-amber-500/10 border border-amber-500/20 px-3 py-1 rounded-full uppercase tracking-wider">
                Image 1 of 1
            </span>
        </div>

        <!-- Zoom Controls -->
        <div class="flex items-center gap-2 bg-navy-900/80 border border-white/10 rounded-xl px-3 py-1.5 shadow-lg">
            <button type="button" onclick="zoomOutLightbox()" title="Zoom Out (-)" class="w-8 h-8 rounded-lg flex items-center justify-center text-gray-300 hover:text-white hover:bg-white/10 transition-all active:scale-95">
                <i class="fas fa-search-minus text-sm"></i>
            </button>
            <span id="lightboxZoomLevel" class="text-xs font-mono font-bold text-gray-200 min-w-[45px] text-center">100%</span>
            <button type="button" onclick="zoomInLightbox()" title="Zoom In (+)" class="w-8 h-8 rounded-lg flex items-center justify-center text-gray-300 hover:text-white hover:bg-white/10 transition-all active:scale-95">
                <i class="fas fa-search-plus text-sm"></i>
            </button>
            <div class="w-px h-5 bg-white/10 mx-1"></div>
            <button type="button" onclick="resetZoomLightbox()" title="Reset Zoom (0)" class="w-8 h-8 rounded-lg flex items-center justify-center text-gray-300 hover:text-white hover:bg-white/10 transition-all active:scale-95">
                <i class="fas fa-rotate-left text-xs"></i>
            </button>
        </div>

        <!-- Exit / Close Button -->
        <button type="button" onclick="closeLightbox()" title="Exit Full Screen (Esc)" class="w-10 h-10 rounded-xl bg-red-500/20 hover:bg-red-500 text-red-400 hover:text-white border border-red-500/30 flex items-center justify-center transition-all active:scale-95 shadow-lg">
            <i class="fas fa-xmark text-lg"></i>
        </button>
    </div>

    <!-- Main Viewport with Navigation Controls -->
    <div class="relative flex-1 flex items-center justify-center overflow-hidden p-4 md:p-8" onwheel="handleLightboxWheel(event)">
        <!-- Previous Button -->
        <button type="button" onclick="prevGalleryImage()" title="Previous Image (Left Arrow)" class="absolute left-4 md:left-8 z-20 w-12 h-12 rounded-2xl bg-navy-900/80 hover:bg-amber-500 text-white hover:text-navy-950 border border-white/10 hover:border-amber-400 flex items-center justify-center shadow-2xl transition-all duration-200 active:scale-90 group">
            <i class="fas fa-chevron-left text-lg group-hover:-translate-x-0.5 transition-transform"></i>
        </button>

        <!-- Active Scalable Image -->
        <div class="relative max-w-full max-h-full flex items-center justify-center overflow-hidden">
            <img id="lightboxActiveImage" src="" alt="Gallery Preview" class="max-w-[85vw] max-h-[75vh] object-contain transition-transform duration-200 ease-out rounded-xl shadow-2xl pointer-events-auto">
        </div>

        <!-- Next Button -->
        <button type="button" onclick="nextGalleryImage()" title="Next Image (Right Arrow)" class="absolute right-4 md:right-8 z-20 w-12 h-12 rounded-2xl bg-navy-900/80 hover:bg-amber-500 text-white hover:text-navy-950 border border-white/10 hover:border-amber-400 flex items-center justify-center shadow-2xl transition-all duration-200 active:scale-90 group">
            <i class="fas fa-chevron-right text-lg group-hover:translate-x-0.5 transition-transform"></i>
        </button>
    </div>

    <!-- Bottom Caption Bar -->
    <div class="p-4 md:px-8 border-t border-white/10 bg-navy-900/60 z-10 text-center">
        <p id="lightboxCaption" class="text-sm md:text-base font-semibold text-gray-200 max-w-3xl mx-auto truncate">
            Campus Gallery Image
        </p>
    </div>
</div>

<script>
let currentGalleryIndex = 0;
let currentZoomScale = 1;
let galleryItems = [];

function getGalleryData() {
    const dataScript = document.getElementById('gallery-data');
    if (dataScript) {
        try {
            return JSON.parse(dataScript.textContent);
        } catch (e) {
            console.error('Error parsing gallery JSON:', e);
        }
    }
    return [];
}

function openLightbox(index) {
    galleryItems = getGalleryData();
    if (!galleryItems || !galleryItems.length) return;
    
    currentGalleryIndex = (index >= 0 && index < galleryItems.length) ? index : 0;
    currentZoomScale = 1;
    updateLightboxImage();
    
    const modal = document.getElementById('galleryLightboxModal');
    if (modal) {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        document.body.style.overflow = 'hidden';
    }
}

function closeLightbox() {
    const modal = document.getElementById('galleryLightboxModal');
    if (modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        document.body.style.overflow = '';
    }
}

function nextGalleryImage() {
    if (!galleryItems || !galleryItems.length) return;
    currentGalleryIndex = (currentGalleryIndex + 1) % galleryItems.length;
    currentZoomScale = 1;
    updateLightboxImage();
}

function prevGalleryImage() {
    if (!galleryItems || !galleryItems.length) return;
    currentGalleryIndex = (currentGalleryIndex - 1 + galleryItems.length) % galleryItems.length;
    currentZoomScale = 1;
    updateLightboxImage();
}

function zoomInLightbox() {
    if (currentZoomScale < 3.0) {
        currentZoomScale = parseFloat((currentZoomScale + 0.25).toFixed(2));
        applyZoom();
    }
}

function zoomOutLightbox() {
    if (currentZoomScale > 0.5) {
        currentZoomScale = parseFloat((currentZoomScale - 0.25).toFixed(2));
        applyZoom();
    }
}

function resetZoomLightbox() {
    currentZoomScale = 1;
    applyZoom();
}

function applyZoom() {
    const img = document.getElementById('lightboxActiveImage');
    const level = document.getElementById('lightboxZoomLevel');
    if (img) {
        img.style.transform = `scale(${currentZoomScale})`;
    }
    if (level) {
        level.textContent = `${Math.round(currentZoomScale * 100)}%`;
    }
}

function handleLightboxWheel(event) {
    event.preventDefault();
    if (event.deltaY < 0) {
        zoomInLightbox();
    } else {
        zoomOutLightbox();
    }
}

function updateLightboxImage() {
    if (!galleryItems || !galleryItems[currentGalleryIndex]) return;
    const item = galleryItems[currentGalleryIndex];
    const img = document.getElementById('lightboxActiveImage');
    const caption = document.getElementById('lightboxCaption');
    const counter = document.getElementById('lightboxCounter');
    
    if (img) img.src = item.src;
    if (caption) caption.textContent = item.caption || 'Campus Media';
    if (counter) counter.textContent = `Image ${currentGalleryIndex + 1} of ${galleryItems.length}`;
    applyZoom();
}

document.addEventListener('keydown', function(e) {
    const modal = document.getElementById('galleryLightboxModal');
    if (modal && !modal.classList.contains('hidden')) {
        if (e.key === 'Escape') closeLightbox();
        else if (e.key === 'ArrowRight') nextGalleryImage();
        else if (e.key === 'ArrowLeft') prevGalleryImage();
        else if (e.key === '+' || e.key === '=') zoomInLightbox();
        else if (e.key === '-') zoomOutLightbox();
        else if (e.key === '0') resetZoomLightbox();
    }
});
</script>
