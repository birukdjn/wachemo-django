<!-- Universal Full-Screen Gallery Lightbox -->
<div id="galleryLightboxModal" class="fixed inset-0 z-[100] bg-navy-950/95 backdrop-blur-2xl hidden flex-col justify-between transition-all duration-300 select-none">
    
    <!-- Top Toolbar -->
    <div class="flex items-center justify-between p-3 md:px-6 border-b border-white/10 bg-navy-900/80 z-20">
        <!-- Counter & Title -->
        <div class="flex items-center gap-3">
            <span id="lightboxCounter" class="text-xs font-bold text-amber-400 bg-amber-500/10 border border-amber-500/20 px-3 py-1 rounded-full uppercase tracking-wider">
                Image 1 of 1
            </span>
        </div>

        <!-- Controls Toolbar (Zoom + Native Fullscreen + Close) -->
        <div class="flex items-center gap-3">
            <!-- Zoom Controls -->
            <div class="flex items-center gap-2 bg-navy-900/90 border border-white/15 rounded-xl px-3 py-1.5 shadow-xl">
                <button type="button" onclick="zoomOutLightbox()" title="Zoom Out (-)" class="w-8 h-8 rounded-lg flex items-center justify-center text-gray-300 hover:text-white hover:bg-white/10 transition-all active:scale-95">
                    <i class="fas fa-search-minus text-sm"></i>
                </button>
                <span id="lightboxZoomLevel" class="text-xs font-mono font-bold text-gray-200 min-w-[45px] text-center">100%</span>
                <button type="button" onclick="zoomInLightbox()" title="Zoom In (+)" class="w-8 h-8 rounded-lg flex items-center justify-center text-gray-300 hover:text-white hover:bg-white/10 transition-all active:scale-95">
                    <i class="fas fa-search-plus text-sm"></i>
                </button>
                <div class="w-px h-5 bg-white/10 mx-1"></div>
                <button type="button" onclick="resetZoomLightbox()" title="Reset Zoom (0)" class="w-8 h-8 rounded-lg flex items-center justify-center text-gray-300 hover:text-white hover:bg-white/10 transition-all active:scale-95">
                    <i class="fas fa-rotate-left text-xs"></i>
                </button>
            </div>

            <!-- Toggle Native Fullscreen Button -->
            <button type="button" onclick="toggleNativeFullscreen()" id="btnNativeFullscreen" title="Toggle True Fullscreen (F)" class="w-10 h-10 rounded-xl bg-navy-900/90 hover:bg-white/10 text-gray-200 hover:text-white border border-white/15 flex items-center justify-center transition-all active:scale-95 shadow-xl">
                <i class="fas fa-expand text-sm"></i>
            </button>

            <!-- Exit / Close Button -->
            <button type="button" onclick="closeLightbox()" title="Exit Full Screen (Esc)" class="w-10 h-10 rounded-xl bg-red-500/20 hover:bg-red-500 text-red-400 hover:text-white border border-red-500/30 flex items-center justify-center transition-all active:scale-95 shadow-xl">
                <i class="fas fa-xmark text-lg"></i>
            </button>
        </div>
    </div>

    <!-- Main Large Viewport with Navigation Controls -->
    <div class="relative flex-1 w-full h-full flex items-center justify-center overflow-hidden p-2 md:p-4" onwheel="handleLightboxWheel(event)">
        <!-- Previous Button -->
        <button type="button" onclick="prevGalleryImage()" title="Previous Image (Left Arrow)" class="absolute left-3 md:left-6 z-30 w-14 h-14 rounded-2xl bg-navy-900/90 hover:bg-amber-500 text-white hover:text-navy-950 border border-white/20 hover:border-amber-400 flex items-center justify-center shadow-2xl transition-all duration-200 active:scale-90 group">
            <i class="fas fa-chevron-left text-xl group-hover:-translate-x-0.5 transition-transform"></i>
        </button>

        <!-- Active Large Image Container -->
        <div class="relative w-full h-full flex items-center justify-center overflow-hidden">
            <img id="lightboxActiveImage" src="" alt="Gallery Preview" class="w-auto h-auto max-w-[96vw] max-h-[88vh] object-contain transition-transform duration-200 ease-out rounded-xl shadow-2xl pointer-events-auto">
        </div>

        <!-- Next Button -->
        <button type="button" onclick="nextGalleryImage()" title="Next Image (Right Arrow)" class="absolute right-3 md:right-6 z-30 w-14 h-14 rounded-2xl bg-navy-900/90 hover:bg-amber-500 text-white hover:text-navy-950 border border-white/20 hover:border-amber-400 flex items-center justify-center shadow-2xl transition-all duration-200 active:scale-90 group">
            <i class="fas fa-chevron-right text-xl group-hover:translate-x-0.5 transition-transform"></i>
        </button>
    </div>

    <!-- Bottom Caption Bar -->
    <div class="p-3 md:px-6 border-t border-white/10 bg-navy-900/80 z-20 text-center">
        <p id="lightboxCaption" class="text-sm md:text-base font-semibold text-gray-200 max-w-4xl mx-auto truncate">
            Campus Gallery Image
        </p>
    </div>
</div>

<script>
let currentGalleryIndex = 0;
let currentZoomScale = 1;
let galleryItems = [];

function getGalleryData() {
    const dataScript = document.getElementById('gallery-data');
    if (dataScript) {
        try {
            return JSON.parse(dataScript.textContent);
        } catch (e) {
            console.error('Error parsing gallery JSON:', e);
        }
    }
    return [];
}

function openLightbox(index) {
    galleryItems = getGalleryData();
    if (!galleryItems || !galleryItems.length) return;
    
    currentGalleryIndex = (index >= 0 && index < galleryItems.length) ? index : 0;
    currentZoomScale = 1;
    updateLightboxImage();
    
    const modal = document.getElementById('galleryLightboxModal');
    if (modal) {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        document.body.style.overflow = 'hidden';
    }
}

function closeLightbox() {
    if (document.fullscreenElement) {
        document.exitFullscreen().catch(err => console.log(err));
    }
    const modal = document.getElementById('galleryLightboxModal');
    if (modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        document.body.style.overflow = '';
    }
}

function toggleNativeFullscreen() {
    const modal = document.getElementById('galleryLightboxModal');
    const btn = document.getElementById('btnNativeFullscreen');
    if (!document.fullscreenElement && modal) {
        modal.requestFullscreen().then(() => {
            if (btn) btn.innerHTML = '<i class="fas fa-compress text-sm"></i>';
        }).catch(err => console.log(err));
    } else {
        document.exitFullscreen().then(() => {
            if (btn) btn.innerHTML = '<i class="fas fa-expand text-sm"></i>';
        }).catch(err => console.log(err));
    }
}

function nextGalleryImage() {
    if (!galleryItems || !galleryItems.length) return;
    currentGalleryIndex = (currentGalleryIndex + 1) % galleryItems.length;
    currentZoomScale = 1;
    updateLightboxImage();
}

function prevGalleryImage() {
    if (!galleryItems || !galleryItems.length) return;
    currentGalleryIndex = (currentGalleryIndex - 1 + galleryItems.length) % galleryItems.length;
    currentZoomScale = 1;
    updateLightboxImage();
}

function zoomInLightbox() {
    if (currentZoomScale < 4.0) {
        currentZoomScale = parseFloat((currentZoomScale + 0.25).toFixed(2));
        applyZoom();
    }
}

function zoomOutLightbox() {
    if (currentZoomScale > 0.5) {
        currentZoomScale = parseFloat((currentZoomScale - 0.25).toFixed(2));
        applyZoom();
    }
}

function resetZoomLightbox() {
    currentZoomScale = 1;
    applyZoom();
}

function applyZoom() {
    const img = document.getElementById('lightboxActiveImage');
    const level = document.getElementById('lightboxZoomLevel');
    if (img) {
        img.style.transform = `scale(${currentZoomScale})`;
    }
    if (level) {
        level.textContent = `${Math.round(currentZoomScale * 100)}%`;
    }
}

function handleLightboxWheel(event) {
    event.preventDefault();
    if (event.deltaY < 0) {
        zoomInLightbox();
    } else {
        zoomOutLightbox();
    }
}

function updateLightboxImage() {
    if (!galleryItems || !galleryItems[currentGalleryIndex]) return;
    const item = galleryItems[currentGalleryIndex];
    const img = document.getElementById('lightboxActiveImage');
    const caption = document.getElementById('lightboxCaption');
    const counter = document.getElementById('lightboxCounter');
    
    if (img) img.src = item.src;
    if (caption) caption.textContent = item.caption || 'Campus Media';
    if (counter) counter.textContent = `Image ${currentGalleryIndex + 1} of ${galleryItems.length}`;
    applyZoom();
}

document.addEventListener('keydown', function(e) {
    const modal = document.getElementById('galleryLightboxModal');
    if (modal && !modal.classList.contains('hidden')) {
        if (e.key === 'Escape') closeLightbox();
        else if (e.key === 'ArrowRight') nextGalleryImage();
        else if (e.key === 'ArrowLeft') prevGalleryImage();
        else if (e.key === '+' || e.key === '=') zoomInLightbox();
        else if (e.key === '-') zoomOutLightbox();
        else if (e.key === '0') resetZoomLightbox();
        else if (e.key === 'f' || e.key === 'F') toggleNativeFullscreen();
    }
});
</script>
