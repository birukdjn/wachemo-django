{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WSaPS | Wachemo School Academic Portal{% endblock %}</title>
    <meta name="description" content="WSaPS - Wachemo School Academic Portal System. Modern digital learning tools for students and teachers.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        navy: {
                            900: '#0d1a2e',
                            800: '#112240',
                            700: '#162d50',
                            600: '#1a3660',
                        },
                        brand: { blue: '#2563eb', light: '#3b82f6' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* ============================================================
           THEME CSS CUSTOM PROPERTIES
           Dark is default. Light overrides via [data-theme="light"]
        ============================================================ */
        :root, [data-theme="dark"] {
            color-scheme: dark;
            --c-bg:           #0d1a2e;
            --c-bg-2:         #112240;
            --c-bg-3:         #162d50;
            --c-bg-card:      rgba(255,255,255,0.05);
            --c-bg-input:     rgba(255,255,255,0.08);
            --c-border:       rgba(255,255,255,0.08);
            --c-border-2:     rgba(255,255,255,0.12);
            --c-text:         #ffffff;
            --c-text-2:       #94a3b8;
            --c-text-3:       #64748b;
            --c-glass:        rgba(255,255,255,0.07);
            --c-glass-border: rgba(255,255,255,0.12);
            --c-shadow:       rgba(0,0,0,0.5);
            --c-hover:        rgba(255,255,255,0.05);
            --c-scrollbar:    #0d1a2e;
            --c-accent:       #2563eb;
            --c-accent-glow:  rgba(37,99,235,0.25);
            --c-danger:       rgba(239,68,68,0.1);
            --c-danger-text:  #fca5a5;
        }

        [data-theme="light"] {
            color-scheme: light;
            --c-bg:           #f1f5f9;
            --c-bg-2:         #ffffff;
            --c-bg-3:         #f8fafc;
            --c-bg-card:      #ffffff;
            --c-bg-input:     #f8fafc;
            --c-border:       #e2e8f0;
            --c-border-2:     #cbd5e1;
            --c-text:         #0f172a;
            --c-text-2:       #475569;
            --c-text-3:       #94a3b8;
            --c-glass:        rgba(255,255,255,0.92);
            --c-glass-border: rgba(15,23,42,0.08);
            --c-shadow:       rgba(15,23,42,0.1);
            --c-hover:        rgba(15,23,42,0.04);
            --c-scrollbar:    #e2e8f0;
            --c-accent:       #2563eb;
            --c-accent-glow:  rgba(37,99,235,0.15);
            --c-danger:       rgba(239,68,68,0.08);
            --c-danger-text:  #dc2626;
        }

        /* ============================================================
           GLOBAL THEME-AWARE RULES
        ============================================================ */
        * { font-family: 'Inter', sans-serif; box-sizing: border-box; }

        html, body {
            background: var(--c-bg);
            color: var(--c-text);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: var(--c-scrollbar); }
        ::-webkit-scrollbar-thumb { background: var(--c-accent); border-radius: 999px; }

        /* Hero slider */
        .hero-slide { transition: opacity 0.8s ease-in-out; }

        /* Glass card — theme-aware */
        .glass-card {
            background: var(--c-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--c-glass-border);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        /* ============================================================
           STRUCTURAL OVERRIDES FOR TAILWIND DARK COLORS
        ============================================================ */

        /* Backgrounds */
        .bg-navy-900,
        .bg-\[#0a1020\] { background: var(--c-bg) !important; }
        .bg-navy-800    { background: var(--c-bg-2) !important; }
        .bg-navy-700    { background: var(--c-bg-3) !important; }

        /* Semi-transparent white overlays */
        .bg-white\/5  { background: var(--c-hover) !important; }
        .bg-white\/3  { background: var(--c-bg-card) !important; }
        .bg-white\/2  { background: var(--c-bg-card) !important; }
        .bg-white\/8  { background: var(--c-bg-input) !important; }

        /* Borders */
        .border-white\/5  { border-color: var(--c-border) !important; }
        .border-white\/10 { border-color: var(--c-border) !important; }
        .border-white\/15 { border-color: var(--c-border-2) !important; }

        /* Text */
        [data-theme="light"] .text-white         { color: var(--c-text) !important; }
        [data-theme="light"] .text-gray-100       { color: #1e293b !important; }
        [data-theme="light"] .text-gray-200       { color: #334155 !important; }
        [data-theme="light"] .text-gray-300       { color: var(--c-text-2) !important; }
        [data-theme="light"] .text-gray-400       { color: var(--c-text-2) !important; }
        [data-theme="light"] .text-gray-500       { color: var(--c-text-3) !important; }
        [data-theme="light"] .text-gray-600       { color: var(--c-text-3) !important; }
        [data-theme="light"] .text-blue-50        { color: #e0e7ff !important; }
        [data-theme="light"] .text-blue-100       { color: #c7d2fe !important; }

        /* Hover states */
        [data-theme="light"] .hover\:bg-white\/5:hover  { background: var(--c-hover) !important; }
        [data-theme="light"] .hover\:bg-white\/10:hover { background: rgba(15,23,42,0.06) !important; }

        /* Dark placeholder text */
        [data-theme="light"] ::placeholder { color: var(--c-text-3) !important; }

        /* Input fields */
        .input-field {
            background: var(--c-bg-input) !important;
            border-color: var(--c-border-2) !important;
            color: var(--c-text) !important;
            transition: all 0.2s ease;
        }
        .input-field:focus {
            border-color: var(--c-accent) !important;
            box-shadow: 0 0 0 3px var(--c-accent-glow) !important;
        }

        /* Footer */
        [data-theme="light"] footer,
        [data-theme="light"] .newsletter-section {
            border-top-color: var(--c-border) !important;
        }

        /* Sidebar items hover */
        [data-theme="light"] .sidebar-link:not(.active):hover {
            background: var(--c-hover) !important;
            color: var(--c-text) !important;
        }

        /* Dropdown menus */
        [data-theme="light"] .dropdown-menu {
            background: var(--c-bg-2) !important;
            border-color: var(--c-border) !important;
            box-shadow: 0 10px 40px var(--c-shadow) !important;
        }

        /* Card shadows in light mode */
        [data-theme="light"] .glass-card {
            box-shadow: 0 2px 16px var(--c-shadow) !important;
        }

        /* Select options in light mode */
        [data-theme="light"] select option { background: #fff; color: #0f172a; }

        /* ============================================================
           THEME TOGGLE BUTTON
        ============================================================ */
        .theme-toggle {
            width: 2.25rem; height: 2.25rem;
            border-radius: 0.625rem;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--c-hover);
            border: 1px solid var(--c-border);
            color: var(--c-text-2);
            flex-shrink: 0;
        }
        .theme-toggle:hover {
            background: var(--c-accent);
            color: #fff;
            border-color: var(--c-accent);
        }
        .theme-toggle .icon-sun  { display: none; }
        .theme-toggle .icon-moon { display: block; }
        [data-theme="light"] .theme-toggle .icon-sun  { display: block; }
        [data-theme="light"] .theme-toggle .icon-moon { display: none; }

        /* ============================================================
           AUTH PAGES BODY (login.html / signup.html)
        ============================================================ */
        [data-theme="light"] .auth-bg {
            background: linear-gradient(135deg, #dbeafe 0%, #f1f5f9 40%, #e0e7ff 100%) !important;
        }

        /* ============================================================
           PORTAL MAIN BG
        ============================================================ */
        [data-theme="light"] .portal-main-bg { background: #f1f5f9 !important; }

        /* Ensure transitions everywhere */
        nav, aside, footer, section, div, a, button, input, select, textarea {
            transition-property: background-color, border-color, color;
            transition-duration: 0.25s;
            transition-timing-function: ease;
        }
        /* Reset transition on animation-sensitive elements */
        .hero-slide, .slider-dot { transition: opacity 0.8s ease-in-out !important; }
    </style>

    {% block extra_head %}{% endblock %}

    <!-- Apply saved theme BEFORE paint (prevents flash) -->
    <script>
        (function() {
            var saved = localStorage.getItem('wsaps-theme') ||
                (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>
</head>
<body class="antialiased">

    {% include 'includes/header.html' %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include 'includes/footer.html' %}

    <script>
        // ===== Theme Toggle Logic =====
        function initTheme() {
            var html = document.documentElement;
            var saved = localStorage.getItem('wsaps-theme') ||
                (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            html.setAttribute('data-theme', saved);
        }

        function toggleTheme() {
            var html = document.documentElement;
            var current = html.getAttribute('data-theme');
            var next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('wsaps-theme', next);
        }

        initTheme();

        // Attach to all toggle buttons
        document.querySelectorAll('[data-theme-toggle]').forEach(function(btn) {
            btn.addEventListener('click', toggleTheme);
        });

        // ===== Mobile Nav Toggle =====
        var navToggle = document.getElementById('navToggle');
        var navMenu   = document.getElementById('navbarNav');
        if (navToggle && navMenu) {
            navToggle.addEventListener('click', function() {
                navMenu.classList.toggle('hidden');
            });
        }

        // ===== Auto-dismiss messages =====
        setTimeout(function() {
            document.querySelectorAll('[data-auto-dismiss]').forEach(function(el) {
                el.style.opacity = '0';
                el.style.transition = 'opacity 0.4s';
                setTimeout(function() { el.remove(); }, 400);
            });
        }, 5000);
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
