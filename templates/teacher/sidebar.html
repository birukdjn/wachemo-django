<div class="w-64 bg-slate-900 text-slate-100 min-h-screen flex flex-col shadow-xl">
    <div class="p-6 border-b border-slate-800 flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-md">
            <i class="fas fa-chalkboard-teacher"></i>
        </div>
        <div>
            <h2 class="font-bold text-lg leading-tight">Teacher Portal</h2>
            <p class="text-xs text-slate-400">Wachemo University</p>
        </div>
    </div>
    
    <div class="p-4">
        <div class="mb-6">
            <p class="px-3 text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Navigation</p>
            <nav class="space-y-1">
                <a href="{% url 'teacher_dashboard' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {% if request.resolver_match.url_name == 'teacher_dashboard' %}bg-indigo-600 text-white{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
                    <i class="fas fa-chart-line w-5 text-center"></i>
                    <span>Dashboard</span>
                </a>
                <a href="{% url 'teacher_courses' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {% if request.resolver_match.url_name == 'teacher_courses' %}bg-indigo-600 text-white{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
                    <i class="fas fa-book-open w-5 text-center"></i>
                    <span>My Courses</span>
                </a>
                <a href="{% url 'index' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition-colors">
                    <i class="fas fa-globe w-5 text-center"></i>
                    <span>Main Site</span>
                </a>
            </nav>
        </div>

        {% if instructor %}
        <div class="pt-6 border-t border-slate-800">
            <p class="px-3 text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Instructor Info</p>
            <div class="px-3 py-2 bg-slate-800/60 rounded-lg">
                <p class="text-sm font-medium text-slate-200">{{ instructor.get_full_name }}</p>
                <p class="text-xs text-slate-400">{{ instructor.employee_id }}</p>
                <span class="inline-block mt-2 px-2 py-0.5 text-xs font-semibold bg-indigo-500/20 text-indigo-300 rounded border border-indigo-500/30">
                    {{ instructor.department.name|default:"Faculty" }}
                </span>
            </div>
        </div>
        {% endif %}
    </div>

    <div class="mt-auto p-4 border-t border-slate-800">
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="w-full flex items-center justify-center gap-2 px-4 py-2 bg-slate-800 hover:bg-red-600 text-slate-300 hover:text-white rounded-lg text-sm font-medium transition-colors">
                <i class="fas fa-sign-out-alt"></i>
                <span>Log Out</span>
            </button>
        </form>
    </div>
</div>
